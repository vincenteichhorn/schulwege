services:
  schulwege-nominatim:
    image: mediagis/nominatim:5.2
    container_name: schulwege-nominatim
    profiles: [serve, build-nominatim]
    ports:
      - "${NOMINATIM_HOST_PORT:-8080}:8080"
    environment:
      PBF_URL: ${REGION_PBF_URL:-https://download.geofabrik.de/europe/germany/brandenburg-latest.osm.pbf}
      NOMINATIM_PASSWORD: ${NOMINATIM_PASSWORD:-supersecret}
    volumes:
      - ${NOMINATIM_DATA_VOLUME:-./data/nominatim/data}:/var/lib/postgresql/16/main
      - ${NOMINATIM_SETTINGS_VOLUME:-./data/nominatim/settings}:/etc/nominatim
      - ${NOMINATIM_FLATNODE_VOLUME:-./data/nominatim/flatnode}:/nominatim/flatnode
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/status"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30m

  schulwege-opentripplanner-builder:
    image: opentripplanner/opentripplanner:latest
    container_name: schulwege-opentripplanner-builder
    profiles: [build-opentripplanner]
    environment:
      JAVA_TOOL_OPTIONS: "-Xmx8g"
      REGION_PBF_URL: ${REGION_PBF_URL}
      OTP_GTFS_URL: ${OTP_GTFS_URL}
    volumes:
      - ${OTP_DATA_VOLUME:-./data/opentripplanner}:/var/opentripplanner
    depends_on:
      schulwege-opentripplanner-downloader:
        condition: service_completed_successfully
    command: ["--build", "--save"]
    restart: "no"

  schulwege-opentripplanner-downloader:
    image: alpine:3.22
    container_name: schulwege-opentripplanner-downloader
    profiles: [build-opentripplanner]
    environment:
      OTP_DATA_DIR: /var/opentripplanner
      REGION_PBF_URL: ${REGION_PBF_URL:-https://download.geofabrik.de/europe/germany/brandenburg-latest.osm.pbf}
      OTP_GTFS_URL: ${OTP_GTFS_URL:-https://vbb.de/vbbgtfs}
    volumes:
      - ${OTP_DATA_VOLUME:-./data/opentripplanner}:/var/opentripplanner
      - ./scripts/download_otp.sh:/usr/local/bin/download_otp.sh:ro
    command: ["sh", "-c", "apk add --no-cache bash wget && bash /usr/local/bin/download_otp.sh"]
    restart: "no"

  schulwege-opentripplanner:
    image: opentripplanner/opentripplanner:latest
    container_name: schulwege-opentripplanner
    profiles: [serve]
    environment:
      JAVA_TOOL_OPTIONS: "-Xmx8g"
    command: ["--load", "--serve"]
    ports:
      - "${OTP_HOST_PORT:-9080}:8080"
    volumes:
      - ${OTP_DATA_VOLUME:-./data/opentripplanner}:/var/opentripplanner
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--delete-after", "http://localhost:8080"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 1m

  schulwege-frontend:
    build:
      context: .
      dockerfile: docker/Dockerfile
    container_name: schulwege-frontend
    profiles: [serve]
    ports:
      - "${APP_PORT:-5173}:5173"
    environment:
      DEV_MODE: "0"
      SQL_DATABASE_URL: ${SQL_DATABASE_URL:-sqlite:///data/schulwege/schulwege.db}
      MODEL_CONFIG_FILE: ${MODEL_CONFIG_FILE:-./model_config.json}
    volumes:
      - ./:/schulwege
    restart: unless-stopped

volumes:
  nominatim-data:
  nominatim-settings:
  nominatim-flatnode:
  otp-data:
